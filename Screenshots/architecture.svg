<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1100" height="640" rx="12" fill="#12161c"/>
  <text x="36" y="46" fill="#e8eef6" font-size="21" font-weight="600">SchemaMigrationKit &#8212; versioned contracts for structured output</text>
  <text x="36" y="70" fill="#7d8794" font-size="13">actor-owned registry &#183; adjacent-hop paths &#183; validated after every step</text>

  <rect x="36" y="98" width="300" height="126" rx="10" fill="#1b212a" stroke="#2d3644"/>
  <text x="52" y="124" fill="#7ee2b8" font-size="14" font-weight="600">Producers</text>
  <text x="52" y="149" fill="#c8d1dc" font-size="12.5">ProviderGatewayKit reply (v1)</text>
  <text x="52" y="170" fill="#c8d1dc" font-size="12.5">Cached payload from last release</text>
  <text x="52" y="191" fill="#c8d1dc" font-size="12.5">Agent tool arguments</text>
  <text x="52" y="212" fill="#6f7b8b" font-size="11.5">[String: FieldValue]</text>

  <rect x="400" y="98" width="330" height="126" rx="10" fill="#1b212a" stroke="#3d4a5e"/>
  <text x="416" y="124" fill="#8ec6ff" font-size="14" font-weight="600">SchemaRegistry (actor)</text>
  <text x="416" y="149" fill="#c8d1dc" font-size="12.5">register &#183; registerStep &#183; deprecate</text>
  <text x="416" y="170" fill="#c8d1dc" font-size="12.5">plan &#183; coverage &#183; compatibility</text>
  <text x="416" y="191" fill="#c8d1dc" font-size="12.5">migrate &#183; negotiate</text>
  <text x="416" y="212" fill="#6f7b8b" font-size="11.5">one actor turn: no mid-plan drift</text>

  <rect x="794" y="98" width="270" height="126" rx="10" fill="#1b212a" stroke="#2d3644"/>
  <text x="810" y="124" fill="#7ee2b8" font-size="14" font-weight="600">Consumers</text>
  <text x="810" y="149" fill="#c8d1dc" font-size="12.5">Today&#8217;s decoder (v3)</text>
  <text x="810" y="170" fill="#c8d1dc" font-size="12.5">A client still on v1</text>
  <text x="810" y="191" fill="#c8d1dc" font-size="12.5">StructuredOutputKit</text>
  <text x="810" y="212" fill="#6f7b8b" font-size="11.5">validated before delivery</text>

  <path d="M336 161 L396 161" stroke="#3d4a5e" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M730 161 L790 161" stroke="#3d4a5e" stroke-width="1.6" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#3d4a5e"/>
    </marker>
  </defs>

  <rect x="36" y="256" width="1028" height="176" rx="10" fill="#161b23" stroke="#2d3644"/>
  <text x="56" y="284" fill="#8ec6ff" font-size="14" font-weight="600">The path is a walk over adjacent versions &#8212; never a shortcut</text>

  <rect x="80" y="308" width="118" height="52" rx="8" fill="#1b212a" stroke="#3d4a5e"/>
  <text x="115" y="333" fill="#e8eef6" font-size="15" font-weight="600">v1</text>
  <text x="94" y="351" fill="#6f7b8b" font-size="11">severity: Int</text>

  <rect x="322" y="308" width="118" height="52" rx="8" fill="#1b212a" stroke="#3d4a5e"/>
  <text x="357" y="333" fill="#e8eef6" font-size="15" font-weight="600">v2</text>
  <text x="332" y="351" fill="#6f7b8b" font-size="11">+ confidence?</text>

  <rect x="564" y="308" width="118" height="52" rx="8" fill="#1b212a" stroke="#3d4a5e"/>
  <text x="599" y="333" fill="#e8eef6" font-size="15" font-weight="600">v3</text>
  <text x="570" y="351" fill="#6f7b8b" font-size="11">severity: String</text>

  <path d="M198 326 L318 326" stroke="#7ee2b8" stroke-width="1.6" marker-end="url(#b)"/>
  <path d="M440 326 L560 326" stroke="#7ee2b8" stroke-width="1.6" marker-end="url(#b)"/>
  <path d="M560 348 L444 348" stroke="#ffb454" stroke-width="1.6" marker-end="url(#c)"/>
  <path d="M318 348 L202 348" stroke="#ffb454" stroke-width="1.6" marker-end="url(#c)"/>
  <defs>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#7ee2b8"/>
    </marker>
    <marker id="c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#ffb454"/>
    </marker>
  </defs>
  <text x="216" y="320" fill="#7ee2b8" font-size="11">upgrade</text>
  <text x="458" y="320" fill="#7ee2b8" font-size="11">upgrade</text>
  <text x="452" y="367" fill="#ffb454" font-size="11">downgrade &#8212; lossy(issuedAtTick)</text>
  <text x="212" y="367" fill="#ffb454" font-size="11">downgrade &#8212; lossy(confidence)</text>

  <path d="M139 300 L139 288 L599 288 L599 300" stroke="#ff5f57" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
  <text x="722" y="292" fill="#ff5f57" font-size="11.5">v1 &#8594; v3 shortcut step: refused at registration</text>

  <rect x="740" y="300" width="304" height="112" rx="8" fill="#12161c" stroke="#2d3644"/>
  <text x="758" y="324" fill="#8ec6ff" font-size="12.5" font-weight="600">After every hop</text>
  <text x="758" y="346" fill="#c8d1dc" font-size="11.5">validate against that hop&#8217;s target schema</text>
  <text x="758" y="366" fill="#c8d1dc" font-size="11.5">mismatch &#8594; postconditionViolated,</text>
  <text x="758" y="384" fill="#c8d1dc" font-size="11.5">naming the step that broke it</text>
  <text x="758" y="404" fill="#6f7b8b" font-size="11">the caller never sees a partial payload</text>

  <rect x="36" y="456" width="332" height="150" rx="10" fill="#161b23" stroke="#2d3644"/>
  <text x="56" y="482" fill="#8ec6ff" font-size="13.5" font-weight="600">Refusals it can evidence</text>
  <text x="56" y="506" fill="#c8d1dc" font-size="12">source payload invalid for its own version</text>
  <text x="56" y="527" fill="#c8d1dc" font-size="12">step produced the wrong shape</text>
  <text x="56" y="548" fill="#c8d1dc" font-size="12">step threw</text>
  <text x="56" y="569" fill="#c8d1dc" font-size="12">path would drop fields, no opt-in</text>
  <text x="56" y="590" fill="#c8d1dc" font-size="12">target version is past its sunset</text>

  <rect x="384" y="456" width="332" height="150" rx="10" fill="#161b23" stroke="#2d3644"/>
  <text x="404" y="482" fill="#8ec6ff" font-size="13.5" font-weight="600">Answered before traffic arrives</text>
  <text x="404" y="506" fill="#c8d1dc" font-size="12">coverage(of:) &#8212; which hops have no step</text>
  <text x="404" y="527" fill="#c8d1dc" font-size="12">compatibility(of:from:to:) &#8212; breaking?</text>
  <text x="404" y="548" fill="#c8d1dc" font-size="12">negotiate(...) &#8212; exact, migrate, or why not</text>
  <text x="404" y="569" fill="#6f7b8b" font-size="11.5">time is a caller-supplied Int tick;</text>
  <text x="404" y="590" fill="#6f7b8b" font-size="11.5">the package never reads a clock</text>

  <rect x="732" y="456" width="332" height="150" rx="10" fill="#161b23" stroke="#2d3644"/>
  <text x="752" y="482" fill="#8ec6ff" font-size="13.5" font-weight="600">Seams, not dependencies</text>
  <text x="752" y="506" fill="#c8d1dc" font-size="12">PayloadMigrating &#8212; one hop&#8217;s surgery</text>
  <text x="752" y="527" fill="#c8d1dc" font-size="12">MigrationEventRecording &#8212; audit trail</text>
  <text x="752" y="548" fill="#c8d1dc" font-size="12">FieldValue &#8212; own JSON vocabulary</text>
  <text x="752" y="569" fill="#6f7b8b" font-size="11.5">no compile-time dependency on any</text>
  <text x="752" y="590" fill="#6f7b8b" font-size="11.5">sibling package</text>
</svg>
